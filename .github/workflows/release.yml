name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Version matches the plugin and the companion
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for v in "$(python3 -c "import json; print(json.load(open('plugin/plugin.json'))['version'])")" \
                   "$(grep -oP '^version = "\K[^"]+' plugin/Cargo.toml)" \
                   "$(grep -oP '(?<=<Version>)[^<]+' companion/EasyPDM.Companion.csproj)"; do
            if [ "$TAG" != "$v" ]; then
              echo "::error::Tag says $TAG but a version file says $v. Update plugin/plugin.json, plugin/Cargo.toml and companion/EasyPDM.Companion.csproj, commit and tag again."
              exit 1
            fi
          done
      # One self-contained companion per platform (no .NET to install), with the plugin package
      # beside it, which `easypdm-companion setup-solidcraft` picks up by itself.
      - name: Build the plugin and the companion
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rustup target add wasm32-unknown-unknown
          curl -sSfL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.263.0/wasm-tools-1.263.0-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/wasm-tools-1.263.0-x86_64-linux:$PATH"
          plugin/build.sh
          mkdir -p out
          for rid in win-x64 linux-x64; do
            dotnet publish companion -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:DebugType=none -o "build/$rid"
            cp plugin/easypdm.zip "build/$rid/easypdm-solidcraft-plugin.zip"
            cp companion/README.md LICENSE "build/$rid/"
            (cd "build/$rid" && zip -q -r "../../out/EasyPDM_SolidCraft_Companion_${rid}_v${VERSION}.zip" .)
          done
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [$VERSION]" '$0 == header { found=1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > notes.md
          cat notes.md
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "EasyPDM for SolidCraft ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md out/*.zip
